apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: inno
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: auth-service
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
              ephemeral-storage: "512Mi"
          image: inno-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-postgres-secret
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://auth-postgres:5432/$(POSTGRES_DB)"
          volumeMounts:
            - name: jwt-keys
              mountPath: /run/keys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: jwt-keys
          secret:
            secretName: auth-jwt-keys

